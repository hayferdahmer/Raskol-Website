name: RaskolHUD Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - "installer/**"
      - "optional/**"
      - "docs/OPTIONAL_CATALOG.md"
      - ".github/workflows/raskolhud-installer.yml"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "optional/**"
      - "docs/OPTIONAL_CATALOG.md"
      - ".github/workflows/raskolhud-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check out pinned RaskolHUD source
        uses: actions/checkout@v4
        with:
          repository: hayferdahmer/RaskolHUD-mod
          ref: 2df368a807fc693be497b7a1e7a54327ccc58e43
          path: hud-source

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build the client mod
        shell: pwsh
        run: |
          Push-Location hud-source
          gradle :protocol:test :client:build
          Pop-Location
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item hud-source/client/build/libs/raskolhud-client-0.5.0.jar dist/

      - name: Download official Fabric API
        shell: pwsh
        run: |
          $uri = "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.2/fabric-api-0.161.0+26.2.jar"
          Invoke-WebRequest -Uri $uri -OutFile "dist/fabric-api-0.161.0+26.2.jar"
          if ((Get-Item "dist/fabric-api-0.161.0+26.2.jar").Length -lt 1024) {
            throw "Fabric API download looks incomplete."
          }

      - name: Verify both JAR archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:JAVA_HOME\\bin\\jar.exe" tf "dist/raskolhud-client-0.5.0.jar" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "HUD JAR archive validation failed." }
          & "$env:JAVA_HOME\\bin\\jar.exe" tf "dist/fabric-api-0.161.0+26.2.jar" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fabric API JAR archive validation failed." }
          $sha = Get-FileHash "dist/raskolhud-client-0.5.0.jar" -Algorithm SHA256
          $fabric = Get-FileHash "dist/fabric-api-0.161.0+26.2.jar" -Algorithm SHA256
          @(
            "$($sha.Hash.ToLower())  raskolhud-client-0.5.0.jar"
            "$($fabric.Hash.ToLower())  fabric-api-0.161.0+26.2.jar"
          ) | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile EXE installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer/RaskolHUD.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload installer artifact for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RaskolHUD-Installer-0.5.0
          path: |
            dist/RaskolHUD-Installer-0.5.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: raskolhud-installer-v0.5.0
          name: RaskolHUD Installer 0.5.0
          target_commitish: main
          make_latest: false
          files: |
            dist/RaskolHUD-Installer-0.5.0.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Установщик клиентского HUD РАСКОЛА 0.5.0 для Windows.

            Устанавливает RaskolHUD и Fabric API 0.161.0+26.2 в стандартную папку %APPDATA%\\.minecraft\\mods.

            Требования: Minecraft 26.2, Java 25, Fabric Loader 0.19.5.
            Для нестандартных каталогов лаунчеров требуется ручная установка в папку mods соответствующего профиля.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
